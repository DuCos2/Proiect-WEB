<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose New Password | Local Greetings</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="auth-page">
  <a class="auth-back" href="login.html" aria-label="Back to login">&larr; Login</a>

  <form class="auth-panel" action="#" method="post" data-auth-form data-auth-endpoint="backend/public/reset-password.php" data-auth-redirect="login.html">
    <a class="brand auth-brand" href="index.html">
      <img class="brand-logo" src="assets/images/app-logo.png" alt="">
      <span>
        <strong>Local Greetings</strong>
        <small>sports in Iasi</small>
      </span>
    </a>

    <h1>New password</h1>

    <input type="hidden" name="token" data-token-from-url="token">

    <label>Password
      <input type="password" name="password" autocomplete="new-password" placeholder="New password" required minlength="8" maxlength="255">
    </label>

    <p class="form-message" data-auth-message role="status" aria-live="polite"></p>

    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</main>

<script src="assets/js/main.js"></script>
</body>
</html>
