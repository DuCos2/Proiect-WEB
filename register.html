<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Local Greetings</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="auth-page">
  <form class="auth-panel" action="#" method="post">
    <a class="brand auth-brand" href="index.html">
      <span class="brand-mark">LG</span>
      <span>
          <strong>Local Greetings</strong>
          <small>sports in Iasi</small>
        </span>
    </a>
    <h1>Register</h1>
    <label>Name
      <input type="text" placeholder="Your name">
    </label>
    <label>Email
      <input type="email" placeholder="email@example.com">
    </label>
    <label>Password
      <input type="password" placeholder="Password">
    </label>
    <button class="btn btn-primary" type="submit">Create account</button>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </form>
</main>
</body>
</html>
