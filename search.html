<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Local Greetings</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Local Greetings">
    <img class="brand-logo" src="assets/images/app-logo.png" alt="">
    <span>
        <strong>Local Greetings</strong>
        <small>sports in Iasi</small>
      </span>
  </a>

  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
    <span></span>
    <span></span>
    <span></span>
    <span class="sr-only">Menu</span>
  </button>

  <nav class="main-nav" id="main-nav" aria-label="Main navigation">
    <a href="index.html">Events</a>
    <a class="active" href="search.html">Search</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="profile.html" class="profile-link" aria-label="Profile">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4 0-7 2.1-7 5v1h14v-1c0-2.9-3-5-7-5Z"></path>
      </svg>
      Profile
    </a>
  </nav>
</header>

<main>
  <section class="search-header">
    <div>
      <p class="eyebrow">Search</p>
      <h1>Search for venues, courts, and events near them.</h1>
    </div>
  </section>

  <section class="map-layout" aria-label="Map search" style="align-items: start;">
    <div class="map-panel">
      <div class="map-toolbar">
      <div class="filter-chips" aria-label="Quick filters">
        <button class="chip active" type="button">All</button>
        <button class="chip" type="button">Football</button>
        <button class="chip" type="button">Basketball</button>
        <button class="chip" type="button">Tennis</button>
        <button class="chip" type="button">Volleyball</button>
        <button class="chip" type="button">Running</button>
        <button class="chip" type="button">Cycling</button>
        <button class="chip" type="button">Badminton</button>
        <button class="chip" type="button">Table Tennis</button>
      </div>
        <button class="icon-button" type="button" aria-label="My location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4Zm8.9 3A9 9 0 0 0 13 3.1V1h-2v2.1A9 9 0 0 0 3.1 11H1v2h2.1A9 9 0 0 0 11 20.9V23h2v-2.1A9 9 0 0 0 20.9 13H23v-2ZM12 19a7 7 0 1 1 7-7 7 7 0 0 1-7 7Z"></path></svg>
        </button>
      </div>
      <div id="map" style="height: 520px; border-radius: 8px; border: 1px solid var(--line); margin-top: 1rem; position: relative; z-index: 1;"></div>
    </div>

    <aside class="results-panel" aria-label="Results near map" style="height: 580px; overflow-y: scroll;">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow">Nearby</p>
          <h2>Venues and events</h2>
        </div>
      </div>

      <article class="venue-item">
        <div>
          <h3>Copou Arena</h3>
          <p>3 active events</p>
        </div>
        <span>1.2 km</span>
      </article>
      <article class="venue-item">
        <div>
          <h3>Palas Sport Court</h3>
          <p>5 active events</p>
        </div>
        <span>2.4 km</span>
      </article>
      <article class="venue-item">
        <div>
          <h3>Ciric Base</h3>
          <p>2 active events</p>
        </div>
        <span>4.8 km</span>
      </article>
    </aside>
  </section>

  <section class="advanced-search">
    <details open>
      <summary>Advanced search</summary>
<form class="advanced-grid" action="#" method="get">
  <label>
    Sport
    <select name="sport">
      <option>Any sport</option>
      <option>Football</option>
      <option>Basketball</option>
      <option>Tennis</option>
      <option>Volleyball</option>
      <option>Running</option>
      <option>Cycling</option>
      <option>Badminton</option>
      <option>Table Tennis</option>
    </select>
  </label>
  <label>
    Area
    <select name="area">
      <option>All of Iasi</option>
      <option>Copou</option>
      <option>Palas</option>
      <option>Ciric</option>
      <option>Podu Ros</option>
      <option>Pacurari</option>
      <option>Centru</option>
    </select>
  </label>
        <label>
          Date
          <input type="text" name="date" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
        </label>
        <label>
          Level
          <select name="level">
            <option>Any level</option>
            <option>Beginner</option>
            <option>Medium</option>
            <option>Expert</option>
          </select>
        </label>
        <label>
          Available spots
          <input type="number" name="min_spots" min="1" placeholder="Minimum">
        </label>

        <button class="btn btn-primary" type="submit">Apply filters</button>
      </form>
    </details>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
