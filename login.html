<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Local Greetings</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="auth-page">
  <a class="auth-back" href="index.html" aria-label="Back to home">&larr; Home</a>
  <form class="auth-panel" action="#" method="post">
    <a class="brand auth-brand" href="index.html">
      <img class="brand-logo" src="assets/images/app-logo.png" alt="">
      <span>
          <strong>Local Greetings</strong>
          <small>sports in Iasi</small>
        </span>
    </a>
    <h1>Login</h1>
    <label>Email
      <input type="email" placeholder="email@example.com">
    </label>
    <label>Password
      <input type="password" placeholder="Password">
    </label>
    <button class="btn btn-primary" type="submit">Sign In</button>
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </form>
</main>
</body>
</html>
