<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Local Greetings</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="auth-page">
  <a class="auth-back" href="login.html" aria-label="Back to login">&larr; Login</a>

  <form class="auth-panel" action="#" method="post" data-auth-form data-auth-endpoint="backend/public/request-password-reset.php">
    <a class="brand auth-brand" href="index.html">
      <img class="brand-logo" src="assets/images/app-logo.png" alt="">
      <span>
        <strong>Local Greetings</strong>
        <small>sports in Iasi</small>
      </span>
    </a>

    <h1>Reset password</h1>

    <label>Email
      <input type="email" name="email" autocomplete="email" placeholder="email@example.com" required>
    </label>

    <p class="form-message" data-auth-message role="status" aria-live="polite"></p>

    <button class="btn btn-primary" type="submit">Send reset link</button>

    <p>Remembered your password? <a href="login.html">Login</a></p>
  </form>
</main>

<script src="assets/js/main.js"></script>
</body>
</html>
